# Local development stack: Postgres 16 plus the API.

services:
  db:
    image: postgres:18-alpine  # matches the hosted database
    environment:
      POSTGRES_USER: justpick
      POSTGRES_PASSWORD: justpick
      POSTGRES_DB: justpick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justpick"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://justpick:justpick@db:5432/justpick
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
